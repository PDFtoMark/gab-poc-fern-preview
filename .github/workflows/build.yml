name: "Preview Fern Docs: Build"

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect sources (benign main version)
        run: |
          mkdir -p payload/fern payload/preview-metadata
          echo '{"organization": "nvidia", "version": "latest"}' > payload/fern/fern.config.json
          echo "777" > payload/preview-metadata/pr_number
          echo "some-branch" > payload/preview-metadata/head_ref
          printf 'docs/a.md\n' > payload/preview-metadata/changed_md_files
      - name: Upload fern sources and metadata
        uses: actions/upload-artifact@v4
        with:
          name: fern-preview
          path: payload/
